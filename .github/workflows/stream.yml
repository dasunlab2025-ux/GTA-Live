name: YouTube Live Stream (Educational)

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg python3-pip
          pip3 install pygame

      - name: Start Live Stream
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          Xvfb :99 -screen 0 1080x1920x24 &
          export DISPLAY=:99
          python3 countdown.py &
          sleep 5
          ffmpeg -f x11grab -video_size 1080x1920 -framerate 30 -i :99 \
          -stream_loop -1 -i music.mp3 \
          -c:v libx264 -preset veryfast -pix_fmt yuv420p \
          -c:a aac -b:a 128k -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY
